    <header>
      <div class="logo">
        <h1>B</h1>

    <main>
      <h1>Add new blog</h1>
      <p>Publish a new article to the platform</p>

      <label for="title">Blog title</label>
      <input type="text" id="title" placeholder="Blog title" />
      <label for="category">Category</label>
      <input type="text" id="category" placeholder="Category" />
      <label for="content">Content</label>
      <textarea name="" id="content" placeholder="Write your blog post here..."></textarea>
      <label for="blog_image">Cover image (URL)</label>
      <input type="url" id="blog_image" name="image" placeholder="https://picsum.photos/seed/1/600/300" />
      <button onclick="addblog()"><h3>Publish blog</h3></button>
    </main>
